name: Build Windows exe
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Use local copies of the Excel libraries (so the app works offline)
        shell: bash
        run: |
          mkdir -p vendor
          cp node_modules/xlsx/dist/xlsx.full.min.js vendor/
          cp node_modules/exceljs/dist/exceljs.min.js vendor/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#vendor/xlsx.full.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js#vendor/exceljs.min.js#' index.html
          grep -c "vendor/" index.html
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: SMV-Operation-Master-Windows
          path: |
            dist/SMV-Operation-Master.exe
            dist/SMV-Operation-Master-Setup.exe
