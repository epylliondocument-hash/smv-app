<script>
/* Live (GitHub) version: all data is saved in ONE FILE on this PC (Chrome / Edge). Nothing is sent to any server. */
(function(){
 if(window.claude)return;
 const SUP=window.isSecureContext&&'showSaveFilePicker' in window&&'showOpenFilePicker' in window;
 let cache={v:0,c:{}},handle=null,pend=null,chain=Promise.resolve();
 const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('smvm_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 const idbGet=async(k='file')=>{try{const d=await idb();return await new Promise(res=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(x){return null}};
 const idbSet=async(h,k='file')=>{try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(h,k)}catch(x){}};
 async function readFile(){const t=await (await handle.getFile()).text();cache=t.trim()?JSON.parse(t):{v:0,c:{}};if(!cache||typeof cache!=='object')cache={};cache.c=cache.c||{};cache.v=cache.v||0}
 async function writeFile(){if(window.smvDesk){await window.smvDesk.save(JSON.stringify(cache));return}const w=await handle.createWritable();await w.write(JSON.stringify(cache));await w.close()}
 function flush(){if(pend)return pend;pend=new Promise((res,rej)=>{setTimeout(()=>{pend=null;chain=chain.then(writeFile).then(res,rej)},300)});return pend}
 window.addEventListener('beforeunload',e=>{if(pend){e.preventDefault();e.returnValue=''}});
 const db={collection:n=>({
  onSnapshot(cb){setTimeout(()=>cb({docs:Object.entries(cache.c[n]||{}).map(([id,d])=>({id,data:()=>d}))}),0)},
  doc:id=>({set:async d=>{(cache.c[n]=cache.c[n]||{})[id]=d;cache.v++;await flush()},delete:async()=>{delete (cache.c[n]||{})[id];cache.v++;await flush()}})})};
 const dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
 async function connect(){if(window.smvDesk){const t=await window.smvDesk.load();if(t){try{cache=JSON.parse(t)}catch(e){cache={}}cache.c=cache.c||{};cache.v=cache.v||0;return db}}return overlay(!!window.smvDesk)}
 function overlay(desk){
  return new Promise(res=>{
   const K=['o','p','b','s','f'],o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(10,15,25,.75);display:flex;align-items:center;justify-content:center;padding:16px;font:14px system-ui,sans-serif';
   o.innerHTML='<div style="background:#fff;color:#1b2430;border-radius:14px;max-width:470px;width:100%;padding:20px;box-shadow:0 10px 40px #0006"><h2 style="margin:0 0 8px;font-size:18px">Continue your work</h2><p id="m" style="margin:0 0 14px;color:#4b5563">Load your latest backup file to continue exactly where you left off. Nothing is sent to any server.</p><div id="b" style="display:flex;flex-direction:column;gap:8px"></div></div>';
   document.body.appendChild(o);
   const m=o.querySelector('#m'),b=o.querySelector('#b'),done=r=>{o.remove();res(r)};
   const btn=(t,f,pri)=>{const x=document.createElement('button');x.textContent=t;x.style.cssText='padding:10px 14px;border-radius:9px;border:1px solid #cbd5e1;font:inherit;cursor:pointer;background:'+(pri?'#0f766e':'#fff')+';color:'+(pri?'#fff':'#1b2430');x.onclick=async()=>{m.textContent='Working\u2026';try{await f()}catch(e){m.textContent='Could not do that ('+((e&&e.name)||'error')+'): '+((e&&e.message)||e)}};b.appendChild(x);return x};
   btn('Load my backup file\u2026',()=>new Promise((ok,no)=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
    i.oncancel=()=>{m.textContent='No file chosen. Click the button again to choose your backup file.';ok()};
    i.onchange=async()=>{try{const f=i.files[0];if(!f)return ok();const d=JSON.parse(await f.text()),c=d.c||d.collections;if(!c||typeof c!=='object')throw new Error('This file is not a backup of this app.');const M={orders:'o',ops:'p',obs:'b',settings:'s',features:'f'};if(desk){cache={v:Date.now(),c};await writeFile();done(db);ok()}else{for(const k in M)localStorage.setItem('smvm_'+M[k],JSON.stringify(c[k]||{}));done(null);ok()}}catch(e){no(e)}};i.click()}),1);
   let armed=false;
   const eb=btn('Start with an empty workspace',async()=>{if(desk){cache={v:Date.now(),c:{}};await writeFile();done(db);return}const has=K.some(k=>{try{return Object.keys(JSON.parse(localStorage.getItem('smvm_'+k)||'{}')).length>0}catch(e){return false}});
    if(has&&!armed){armed=true;m.textContent='This browser still holds saved data. Starting empty will erase it. Click again to confirm, or load your backup file instead.';eb.textContent='Yes, erase it and start empty';return}
    K.forEach(k=>localStorage.removeItem('smvm_'+k));done(null)});
  });
 }

 async function saveAll(snap){
  if(handle){await writeFile();return{msg:'All data saved to '+handle.name+' at '+new Date().toLocaleTimeString()}}
  if(SUP){const h=await showSaveFilePicker({suggestedName:'smv_master_db.json',types:[{description:'Data file',accept:{'application/json':['.json']}}]});handle=h;await idbSet(h);cache={v:snap.v||1,c:snap.c};await writeFile();return{db,msg:'Saved to '+h.name+'. From now on every change is saved to this file automatically.'}}
  await dl.save({filename:'smv_master_db.json',data:JSON.stringify({v:snap.v||1,c:snap.c})});return{msg:'smv_master_db.json downloaded. Replace your old file with it.'}
 }
 async function saveFile(name,text){
  if(window.smvDesk)return await window.smvDesk.backupAs(name,text);
  if(SUP){const h=await showSaveFilePicker({id:'smvbackup',startIn:'documents',suggestedName:name,types:[{description:'Backup file',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(text);await w.close();return h.name}
  await dl.save({filename:name,data:text});window.claude.noPicker=true;return name
 }
 window.claude={use:async n=>n==='downloads'?dl:n==='db'?await connect():null,saveAll,saveFile,getDir:()=>idbGet('dir'),setDir:h=>idbSet(h,'dir')};
})();
</script>
<script>
const D={"o":[],"p":[],"b":[]};
const K={o:['id','date','buyer','cat','item','style','rtype','ref','proc','rem','qty','smv','mc','hp','prod','grp','lines','days','lead','obm','obsheet'],p:['id','ob','sl','op','mc','mct','smv','rem'],b:['id','sheet','style','item','qty','note','img']};
const $=s=>document.querySelector(s),e=v=>v==null?'':String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base={};for(const t in K)base[t]=D[t].map(r=>Object.fromEntries(K[t].map((k,i)=>[k,r[i]])));
const ov={o:{},p:{},b:{},s:{},f:{}},COL={o:'orders',p:'ops',b:'obs',s:'settings',f:'features'},obm=()=>Object.fromEntries(rows('b').map(b=>[b.id,b]));let curImg=null,curImgs=[],dirty=0,adh=null,abPend=null,adn='',adt=null;const sel=new Set(),sels={b:new Set(),p:new Set(),f:new Set()},cs=()=>tab==='o'?sel:(sels[tab]||new Set());
const F={n0:v=>v==null?'':Math.round(v).toLocaleString('en-US'),f1:v=>v==null?'':v.toFixed(1),f2:v=>v==null?'':v.toFixed(2),f4:v=>v==null?'':v.toFixed(4),pc:v=>v==null?'':(v*100).toFixed(1)+'%'};
let vw='r',tab='o',q='',fsel='',obf=null,page=0,sk=null,sd=1,db=null;const PS=100;
const rt=r=>{if(!r)return'(none)';const l=r.toLowerCase();return/^(sample|test sample)/.test(l)?'Sample':/^(repeat|repart)/.test(l)?'Repeat':l.includes('bulk job ref')?'Bulk Job Ref':/^(sketch|picture)/.test(l)?'Sketch / Picture':/^(tesk|tesw|job-|op-)/.test(l)?'Job Reference (TESK)':l.startsWith('new')?'New':'Other'};
function rows(t){if(t==='r')return binRows();if(t==='f')return featRows();const out=[],seen=new Set();for(const r of base[t]){seen.add(r.id);const d=ov[t][r.id];if(d&&d._del)continue;out.push(d?{...r,...d}:{...r})}
 for(const id in ov[t]){const d=ov[t][id];if(!seen.has(id)&&!d._del)out.push({id,...d})}
 if(t==='o'){const m=obm(),T={},P={};rows('p').forEach(x=>{if(x.ob){if(x.smv>0)T[x.ob]=(T[x.ob]||0)+x.su;(P[x.ob]=P[x.ob]||[]).push(x)}});for(const r of out){r.img=(m[r.ob]||{}).img;const B=m[r.ob];if(B){r.buyer=B.sheet;r.obsheet=B.sheet;r.style=B.style||B.sheet;r.item=B.item||r.item;r.size=B.size;r.smv=T[r.ob]||r.smv;r.proc=r.proc||(P[r.ob]||[]).sort((a,b)=>(a.sl??1e9)-(b.sl??1e9)).map(x=>x.op).join(', ')}r.mp=r.mc!=null&&r.hp!=null?r.mc+r.hp:null;r.eff=r.mp&&r.smv&&r.prod?r.smv*r.prod/(r.mp*60):null;r.sah=r.qty&&r.smv?r.qty*r.smv/60:null;{const w=+(r.qty/(r.prod*10)/r.lead).toFixed(9);r.lines=isFinite(w)&&w>0?Math.ceil(w):null;r.days=r.lines?r.qty/(r.prod*10)/r.lines:null}}}
 if(t==='p'){const m=obm();for(const r of out){r.sheet=(m[r.ob]||{}).sheet;r.size=(m[r.ob]||{}).size||r.size;r.item=(m[r.ob]||{}).item||r.item;r.codeS=r.code?r.code+(r.size&&!/,/.test(r.size)?'-'+r.size:''):'';r.tgt=r.smv>0?60/r.smv:null;r.su=(r.smv>0?r.smv:0)*(r.freq>0?r.freq:1);r.tgtU=r.su>0?60/r.su:null}}
 if(0)for(const r of out){r.tgt=r.smv>0?60/r.smv:null}
 return out}
